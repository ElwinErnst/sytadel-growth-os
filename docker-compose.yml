# Standalone PostgreSQL for Sytadel Growth OS local development.
#
# This is intentionally a SEPARATE compose from sytadel-suite. Growth OS is a
# private, independent repository — it does not join the suite network and does
# not read the auth / vault / billing databases. Port 5440 is chosen to avoid
# colliding with the suite's Postgres instances.
services:
  growth-postgres:
    image: postgres:16-alpine
    container_name: growth-os-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-growth}
      POSTGRES_PASSWORD: ${DB_PASS:-growth-dev-insecure}
      POSTGRES_DB: ${DB_NAME:-growth_os}
    ports:
      - '${DB_PORT:-5440}:5432'
    volumes:
      - growth-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-growth} -d ${DB_NAME:-growth_os}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  growth-pgdata:
